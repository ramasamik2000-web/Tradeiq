services:
  - type: web
    name: tradeiq-free
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRADEIQ_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
